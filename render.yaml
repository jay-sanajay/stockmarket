# Optional Render Blueprint — Dashboard → New + → Blueprint → connect this repo.
# After create, set GEMINI_API_KEY, NEWSDATA_API_KEY, CORS_ORIGINS in the service → Environment.
# Add SKIP_GEMINI_SENTIMENT / ANALYSIS_CACHE_TTL there if you want (optional).

services:
  - type: web
    name: jayquant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
