# JayQuant API on Fly.io — run `fly launch` from repo root to pick app name / region.
# Docs: https://fly.io/docs/reference/configuration/

app = "jayquant-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
